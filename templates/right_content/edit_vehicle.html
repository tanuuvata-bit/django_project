{% extends "layout/body.html" %}

{% block content %}
<div class="container-fluid py-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="mb-0">✏️ Edit Vehicle</h3>
    <a href="{% url 'list_vehicles' %}" class="btn btn-outline-secondary">
      ← Back to List
    </a>
  </div>

  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }}">{{ m }}</div>
    {% endfor %}
  {% endif %}

  <div class="card shadow-sm">
    <div class="card-body">
      <form method="post" action="{% url 'edit_vehicle' vehicle.id %}">
        {% csrf_token %}

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Vehicle ID <span class="text-danger">*</span>
            </label>
            <input type="text" name="vehicle_id" class="form-control"
                   value="{{ vehicle.vehicle_id|default:'' }}" required>
          </div>

          <div class="col-md-6">
            <label class="form-label">Vehicle Name</label>
            <input type="text" name="vehicle_name" class="form-control"
                   value="{{ vehicle.vehicle_name|default:'' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label">License Plate</label>
            <input type="text" name="license_plate" class="form-control"
                   value="{{ vehicle.license_plate|default:'' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Assigned Picker</label>
            <select name="assigned_picker" class="form-select">
              <option value="">— select —</option>
              <option value="picker_1" {% if vehicle.assigned_picker == "picker_1" %}selected{% endif %}>Picker 1</option>
              <option value="picker_2" {% if vehicle.assigned_picker == "picker_2" %}selected{% endif %}>Picker 2</option>
              <option value="picker_3" {% if vehicle.assigned_picker == "picker_3" %}selected{% endif %}>Picker 3</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Capacity (kg)</label>
            <input type="text" name="payload_capacity_kg" class="form-control"
                   value="{{ vehicle.payload_capacity_kg|default:'' }}">
          </div>

          <div class="col-md-6">
            <label class="form-label">Fuel / Engine Type</label>
            <select name="fuel_type" class="form-select">
              <option value="">— select —</option>
              <option value="Diesel" {% if vehicle.fuel_type == "Diesel" %}selected{% endif %}>Diesel</option>
              <option value="Petrol" {% if vehicle.fuel_type == "Petrol" %}selected{% endif %}>Petrol</option>
              <option value="EV"     {% if vehicle.fuel_type == "EV"     %}selected{% endif %}>EV</option>
              <option value="CNG"    {% if vehicle.fuel_type == "CNG"    %}selected{% endif %}>CNG</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
              <option value="Active"      {% if vehicle.status == "Active"      %}selected{% endif %}>Active</option>
              <option value="Maintenance" {% if vehicle.status == "Maintenance" %}selected{% endif %}>Maintenance</option>
              <option value="Inactive"    {% if vehicle.status == "Inactive"    %}selected{% endif %}>Inactive</option>
            </select>
          </div>

        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="bx bx-save"></i> Save Changes
          </button>
          <a href="{% url 'list_vehicles' %}" class="btn btn-outline-secondary">
            Cancel
          </a>
        </div>

      </form>
    </div>
  </div>

</div>
{% endblock %}
